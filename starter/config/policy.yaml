# GuptKavach privacy & adversarial risk policy
policy_version: m10-v1
age_band_years: 5          # default age band width (e.g. 45-49)
upper_age_band: 85         # ages >= this become 85+
date_shift_max_days: 180   # every date of one patient moves by the same secret offset
min_group_size: 5          # minimum k-anonymity group threshold
pin_prefix_digits: 3       # safe PIN prefix digits when generalized

# Combination-based risk scoring weights (sum = 100)
weight_group_size: 35
weight_qi_uniqueness: 25
weight_geo_rarity: 15
weight_temporal: 10
weight_rare_dx: 10
weight_linkage: 5

# Risk category thresholds (0-100 estimated structural risk index)
risk_threshold_moderate: 25
risk_threshold_high: 50
risk_threshold_critical: 75

# Release gate thresholds
max_critical_records_for_pass: 0
max_high_risk_ratio_for_pass: 0.15
min_clinical_retention_ratio: 0.90
